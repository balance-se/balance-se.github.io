# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters

colorScheme = "fire"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = true

enableSearch = false
enableCodeCopy = false

# Core Web Vitals: serve WebP, lazy-load below-the-fold images and prefetch
# in-viewport links. All three are Congo built-ins.
enableImageLazyLoading = true
enableImageWebp = true
enableQuicklink = true

# mainSections = ["section1", "section2"]
robots = "all"

# Congo unions these with each page's own `keywords` front matter.
keywords = [
  "kung fu",
  "shaolin kung fu",
  "Ch'ang stílus",
  "Szeged",
  "harcművészet",
  "önvédelem",
  "küzdősport",
  "tai chi",
  "shuai chiao",
  "edzés",
  "gyerek kung fu",
]

# Fallback og:image / twitter:image for every page that does not set its own
# `images` front matter. Relative to /static.
images = ["img/og-image.png"]

[header]
  layout = "basic" # valid options: basic, hamburger, custom

[footer]
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "page" # valid options: page, profile, custom
  showRecent = false

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  # editURL = "https://github.com/username/repo/"
  editAppendPath = true
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = false
  showTableOfContents = false
  showTaxonomies = false
  showWordCount = false
  showComments = false
  # sharingLinks = ["facebook", "twitter", "pinterest", "reddit", "linkedin", "email"]

[list]
  showBreadcrumbs = false
  showSummary = false
  showTableOfContents = false
  groupByYear = true

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true

[fathomAnalytics]
  # site = "ABC12345"
  # domain = "llama.yoursite.com"

# Self-hosted Umami. Congo's analytics partial is gated on hugo.IsProduction,
# so `hugo serve` and local builds never emit the tag.
[umamiAnalytics]
  site = "f6884e7b-9e1a-44d9-beab-1e75442e62f6"
  script = "https://uma.rocketfuel.pw/script.js"

[verification]
  # google = ""
  # bing = ""
  # pinterest = ""
  # yandex = ""
